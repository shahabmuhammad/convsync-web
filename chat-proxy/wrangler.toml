name = "convsync-chat-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
LANGFLOW_HOST = "https://staging.metamod.ai"
LANGFLOW_FLOW_ID = "8d7bf3a3-dfa3-45dc-9b44-ac15b92cbb28"
# Comma-separated list of sites allowed to call this proxy (no trailing slash).
ALLOWED_ORIGINS = "http://localhost:3000"

# 20 messages per minute per visitor IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# The API key is NOT stored here. Set it once with:
#   npx wrangler secret put LANGFLOW_API_KEY
